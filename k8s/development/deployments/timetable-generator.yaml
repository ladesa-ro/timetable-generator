apiVersion: apps/v1
kind: Deployment
metadata:
  name: ladesa-ro-timetable-api
  namespace: ladesa-ro-development
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ladesa-ro-timetable-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ladesa-ro-timetable-api
    spec:
      containers:
        - name: ladesa-ro-timetable-api
          envFrom:
           - secretRef:
               name: ladesa-ro-timetable-generator-config
               optional: false
          image: ghcr.io/ladesa-ro/timetable-generator/timetable-api:development
          imagePullPolicy: Always
          ports:
            - name: web-port
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 100Mi
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /api/health/
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
      restartPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ladesa-ro-timetable-worker
  namespace: ladesa-ro-development
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ladesa-ro-timetable-worker
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ladesa-ro-timetable-worker
    spec:
      containers:
        - name: ladesa-ro-timetable-worker
          envFrom:
           - secretRef:
               name: ladesa-ro-timetable-generator-config
               optional: false
          image: ghcr.io/ladesa-ro/timetable-generator/timetable-worker:development
          imagePullPolicy: Always
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 200Mi
      restartPolicy: Always
