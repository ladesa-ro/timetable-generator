apiVersion: apps/v1
kind: Deployment
metadata:
  name: ladesa-ro-timetable-generator
  namespace: ladesa-ro-development
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ladesa-ro-timetable-generator
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ladesa-ro-timetable-generator
    spec:
      containers:
        - name: ladesa-ro-timetable-generator
          envFrom:
           - secretRef:
               name: ladesa-ro-timetable-generator-config
               optional: false
          image: ghcr.io/ladesa-ro/timetable-generator/timetable-generator:development
          imagePullPolicy: Always
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 100Mi
      restartPolicy: Always
