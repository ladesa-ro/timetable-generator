name: NUnit Tests and Deploy Allure Reports

on:
  push:
    branches:
      - main
    paths:
      - "**/*"
      - .github/workflows/test-and-report.yml
  pull_request:
    branches:
      - main
    paths:
      - "**/*"
      - .github/workflows/test-and-report.yml
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore

      - name: Test
        run: dotnet test --configuration Debug
        continue-on-error: true

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: |
            ./test/**/allure-results
            ./**/allure-results
          if-no-files-found: ignore
          retention-days: 20

  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download Allure Results artifact
        uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: allure-results
          path: ./allure-results

      - name: Checkout gh-pages
        uses: actions/checkout@v5
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Compute destination dir
        id: compute-dest
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/development" ]; then
            echo "dir=b/development" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "dir=b/main" >> "$GITHUB_OUTPUT"
          else
            echo "dir=r/${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Allure history
        if: always()
        run: |
          mkdir -p allure-history
          if [ -d "gh-pages/${{ steps.compute-dest.outputs.dir }}/history" ]; then
            cp -r "gh-pages/${{ steps.compute-dest.outputs.dir }}/history" "allure-history" || true
          fi

      - name: Generate report
        uses: simple-elf/allure-report-action@v1.13
        if: ${{ always() && hashFiles('allure-results/**') != '' }}
        id: allure-report
        with:
          gh_pages: allure-report/${{ steps.compute-dest.outputs.dir }}
          allure_history: allure-history
          allure_results: allure-results
          keep_reports: 20

      - name: Deploy report to Github Pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ always() && steps.allure-report.outcome == 'success' }}
        with:
          PERSONAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_BRANCH: gh-pages
          PUBLISH_DIR: allure-report
          destination_dir: ${{ steps.compute-dest.outputs.dir }}
