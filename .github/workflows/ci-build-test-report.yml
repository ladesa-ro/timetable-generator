name: CI – Build, Test, and Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore src/Ladesa.TimetableGenerator.slnx

      - name: Build solution
        run: dotnet build src/Ladesa.TimetableGenerator.slnx --configuration Release --no-restore

      - name: Run tests (NUnit)
        run: |
          dotnet test src/Ladesa.TimetableGenerator.Domain.Test/Ladesa.TimetableGenerator.Domain.Test.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory TestResults

      - name: Publish test results to GitHub Checks
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@3a74b2957438d0b6e2e61d67b05318aa25c9e6c6
        with:
          files: |
            **/TestResults/**/*.trx
            **/TestResults/**/*.xml

      - name: PR test summary (Dorny)
        if: always()
        uses: dorny/test-reporter@dc3a92680fcc15842eef52e8c4606ea7ce6bd3f3
        with:
          name: NUnit Test Report
          path: '**/TestResults/**/*.trx'
          reporter: dotnet-trx
          fail-on-error: false

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/**/*'
