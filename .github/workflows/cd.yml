name: CD - Build, publish and deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: cd-${{ github.ref }}

env:
  REGISTRY: ghcr.io
  REGISTRY_USERNAME: ${{ github.actor }}
  REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  IMAGE_BASENAME: ${{ github.repository }}

jobs:
  timetable-generator-ci-image:
    name: "CI: Construção e Publicação da Imagem de Container"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    environment:
      name: ci-cd-timetable-generator-dev

    steps:
      - name: Checkout do código-fonte
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Autenticação no GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_TOKEN }}

      - name: Construção e publicação da imagem de contêiner
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          target: timetable-generator-runtime
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_BASENAME }}/timetable-generator:development
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_BASENAME }}/timetable-generator:cache-development
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_BASENAME }}/timetable-generator:cache-development,mode=max

  timetable-generator-cd-cluster:
    name: "CD: Implantação no Cluster Kubernetes"
    runs-on: deploy

    permissions:
      contents: read

    needs: [ timetable-generator-ci-image ]

    environment:
      name: ci-cd-timetable-generator-dev

    steps:
      - name: Checkout do código-fonte
        uses: actions/checkout@v5

      - name: Implantação da aplicação no Kubernetes
        shell: bash
        working-directory: ./k8s/development/
        run: bash ./deploy.sh
