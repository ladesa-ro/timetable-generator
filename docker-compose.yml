x-podman:
  in_pod: false

services:
  timetable-generator-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: devcontainer

    user: root
    command: sleep infinity

    working_dir: /app/Ladesa.TimetableGenerator
    
    env_file:
      - .env

    volumes:
      - .:/app:z

  message-broker:
    image: docker.io/rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    env_file:
      - .env
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - 5672:5672    # Broker
      - 15672:15672  # Management UI

volumes:
  rabbitmq-data:
